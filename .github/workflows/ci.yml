name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev poppler-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Validate embedded Japanese PDF with Poppler
        run: |
          CAD_PDF_TEST_OUTPUT=/tmp/cad-pdf-fidelity.pdf cargo test -p cad-render-pdf applies_pen_dash_unicode_text_and_dimension_style
          pdfinfo /tmp/cad-pdf-fidelity.pdf
          pdffonts /tmp/cad-pdf-fidelity.pdf | tee /tmp/cad-pdf-fonts.txt
          rg 'CID TrueType.*Identity-H.*yes +yes +yes' /tmp/cad-pdf-fonts.txt
          pdftotext -layout /tmp/cad-pdf-fidelity.pdf /tmp/cad-pdf-fidelity.txt
          rg '910 mm' /tmp/cad-pdf-fidelity.txt
          rg '和室' /tmp/cad-pdf-fidelity.txt
          pdftoppm -png -singlefile /tmp/cad-pdf-fidelity.pdf /tmp/cad-pdf-fidelity
          test -s /tmp/cad-pdf-fidelity.png
      - run: cargo check -p cad-desktop --no-default-features

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/viewer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: apps/viewer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:unit
      - run: pnpm test:e2e

  desktop-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p cad-desktop desktop_file_smoke_covers_edit_comment_layer_history_and_pdf_conflicts --all-features

  macos-desktop-e2e:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: apps/viewer/pnpm-lock.yaml
      - run: pnpm --dir apps/viewer install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir apps/viewer desktop:e2e
        env:
          CAD_E2E_KEEP_ARTIFACTS: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-desktop-e2e
          path: apps/viewer/test-results/desktop-e2e
