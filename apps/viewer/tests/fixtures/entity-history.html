<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entity history</title></head><body><main style="padding:24px"><h1>Entity history</h1><div id="panel"></div><output id="result" aria-live="polite">Choose a history event.</output></main><script type="module">
import {render,h} from 'preact'; import {EntityHistoryPanel} from '/src/entity-history-panel.tsx'; import '/src/styles.css';
render(h(EntityHistoryPanel,{disabled:false,onLoad:async()=>({pinned_revision:'1234567890123456',scanned_commits:50,truncated:true,warnings:['One older source revision could not be decoded.'],events:[{commit_oid:'abcdef0123456789',parent_oid:'11223344',subject:'Wall extended',author:'CAD author',timestamp:1780000000,drawing:'plan',kind:'modified',reasons:['geometry_changed'],before:null,after:null}]}),onLoadBlame:async()=>({pinned_revision:'abcdef0123456789',drawing:'plan',drawing_origin:null,scanned_commits:50,truncated:true,reliable:false,warnings:['An older source revision could not be decoded.'],fields:[{pointer:'/p2',value:[5000,0],origin:{commit_oid:'abcdef0123456789',parent_oid:'11223344',subject:'Wall extended',author:'CAD author',timestamp:1780000000}},{pointer:'/layer',value:'0-1',origin:null}],dependency_changes:[{commit:{commit_oid:'55667788',parent_oid:'11223344',subject:'Pen color updated',author:'CAD author',timestamp:1780000000},reasons:['style_changed']}]}),onCompare:(base,head)=>{document.querySelector('#result').textContent=`${base} → ${head}`;}}),document.querySelector('#panel'));
document.querySelector('details').open=true;
if(new URLSearchParams(location.search).has('ready')) document.querySelector('details > button').click();
if(new URLSearchParams(location.search).has('blame')) [...document.querySelectorAll('button')].find(b=>b.textContent==='Load field origins').click();
</script></body></html>
