[package]
name = "cad-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cad_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
cad-check.workspace = true
cad-edit.workspace = true
cad-diff.workspace = true
cad-export-jww.workspace = true
cad-import-jww.workspace = true
cad-model.workspace = true
cad-render-svg.workspace = true
cad-render-pdf.workspace = true
blake3.workspace = true
chrono.workspace = true
notify-debouncer-mini.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-wdio = { version = "=1.2.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.2.0", optional = true }
tempfile.workspace = true
toml_edit.workspace = true
ulid.workspace = true
