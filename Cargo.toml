[workspace]
members = [
    "crates/cad-model",
    "crates/cad-check",
    "crates/cad-render-svg",
    "crates/cad-diff",
    "crates/cad-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = ""

[workspace.dependencies]
cad-model = { path = "crates/cad-model" }
cad-check = { path = "crates/cad-check" }
cad-render-svg = { path = "crates/cad-render-svg" }
cad-diff = { path = "crates/cad-diff" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
ulid = { version = "1", features = ["serde"] }
tempfile = "3"
svg = "0.18"
insta = "1"
